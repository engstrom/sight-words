<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sight Words</title>
<meta name="theme-color" content="#FDFDF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18202E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sight Words">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #FDFDF6;
  --card: #FFFFFF;
  --ink: #22304A;
  --ink-soft: #5B6780;
  --rule-blue: #8FB3E0;
  --rule-red: #E06A5A;
  --pencil: #F2BE2E;
  --pencil-ink: #3A2A00;
  --leaf: #2F9E58;
  --leaf-edge: #1F7440;
  --on-leaf: #FFFFFF;
  --miss: #D9534A;
  --miss-edge: #A63A32;
  --on-miss: #FFFFFF;
  --line: #DCE3EE;
  --tile-new: #E7EBF2;
  --tile-learn: #F7D774;
  --tile-known: #57B97A;
  --shadow: 0 2px 0 #DCE3EE;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #18202E; --card: #212B3C; --ink: #EEF1F6; --ink-soft: #A7B1C4;
    --rule-blue: #4F72A3; --rule-red: #B45246; --pencil: #F2BE2E; --pencil-ink: #2A1F00;
    --leaf: #4CC077; --leaf-edge: #2E8A50; --on-leaf: #0B2615;
    --miss: #F07167; --miss-edge: #B4483F; --on-miss: #2A0B08; --line: #33405A;
    --tile-new: #2E3A50; --tile-learn: #C9A63E; --tile-known: #3E9C61;
    --shadow: 0 2px 0 #121926; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #18202E; --card: #212B3C; --ink: #EEF1F6; --ink-soft: #A7B1C4;
  --rule-blue: #4F72A3; --rule-red: #B45246; --pencil: #F2BE2E; --pencil-ink: #2A1F00;
  --leaf: #4CC077; --leaf-edge: #2E8A50; --on-leaf: #0B2615;
  --miss: #F07167; --miss-edge: #B4483F; --on-miss: #2A0B08; --line: #33405A;
  --tile-new: #2E3A50; --tile-learn: #C9A63E; --tile-known: #3E9C61;
  --shadow: 0 2px 0 #121926; color-scheme: dark;
}
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: "Andika", "Century Gothic", "Trebuchet MS", system-ui, sans-serif;
  font-size: 18px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--rule-blue); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding: 14px 18px 32px; }

/* Top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.bar-right { display: flex; gap: 14px; }
.stars { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 20px; }
.stars svg { width: 26px; height: 26px; }
.streak { color: var(--ink-soft); font-size: 15px; font-weight: 400; margin-left: 10px; }
.link { background: none; border: 0; padding: 10px 4px; color: var(--ink-soft); text-decoration: underline; text-underline-offset: 3px; font-size: 16px; }

/* The ruled card: the one memorable element */
.sheet {
  position: relative; overflow: hidden; isolation: isolate;
  background: var(--card); border: 2px solid var(--line); border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 34px 16px 30px; margin: 14px 0 18px;
  text-align: center;
  transition: border-color .2s;
}
.sheet.quiz { padding: 58px 16px 52px; }
.sheet::before { /* red margin line, like primary writing paper */
  content: ""; position: absolute; top: 0; bottom: 0; left: 30px; width: 2px; background: var(--rule-red); opacity: .35;
}
.sheet.good { border-color: var(--leaf); }
.sheet.bad { border-color: var(--miss); }
.word {
  position: relative; display: inline-block;
  font-weight: 700; line-height: 1.25;
  font-size: clamp(76px, 24vw, 168px);
  letter-spacing: .01em; white-space: nowrap;
}
.word.long { font-size: clamp(54px, 15vw, 120px); }
.word.small { font-size: clamp(46px, 12vw, 80px); }
/* Ruler: an inline-block whose bottom sits on the text baseline */
.ruler { display: inline-block; width: 0; height: .74em; position: relative; vertical-align: baseline; }
.ruler i { position: absolute; left: -100vw; width: 200vw; height: 0; z-index: -1; }
.ruler .top { top: 0; border-top: 2px solid var(--rule-blue); }
.ruler .mid { bottom: .5em; border-top: 2px dashed var(--rule-red); opacity: .8; }
.ruler .base { bottom: 0; border-top: 2px solid var(--rule-blue); }
.word-text { position: relative; z-index: 1; }
.tag {
  position: absolute; top: 10px; right: 14px; z-index: 2;
  background: var(--pencil); color: var(--pencil-ink);
  font-size: 15px; font-weight: 700; padding: 3px 12px; border-radius: 999px;
}
.verdict { position: absolute; top: 8px; left: 46px; z-index: 2; font-size: 28px; font-weight: 700; }
.verdict.good { color: var(--leaf); }
.verdict.bad { color: var(--miss); }

/* Buttons */
.big {
  display: block; width: 100%; border: 0; border-radius: 18px;
  background: var(--pencil); color: var(--pencil-ink);
  font-size: 26px; font-weight: 700; padding: 18px 20px;
  box-shadow: 0 4px 0 #C99A16;
}
.big:active { transform: translateY(2px); box-shadow: 0 2px 0 #C99A16; }
.plain {
  border: 2px solid var(--line); background: var(--card); border-radius: 14px;
  padding: 12px 16px; font-size: 18px; font-weight: 700;
}
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }

/* The grown-up's answer buttons, under the word where thumbs are */
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ans { border: 0; border-radius: 18px; font-size: 26px; font-weight: 700; min-height: 84px; padding: 12px; }
.ans.right { background: var(--leaf); color: var(--on-leaf); box-shadow: 0 4px 0 var(--leaf-edge); }
.ans.wrong { background: var(--miss); color: var(--on-miss); box-shadow: 0 4px 0 var(--miss-edge); }
.ans.skip { grid-column: 1 / -1; min-height: 56px; font-size: 20px; background: var(--card); border: 2px solid var(--line); color: var(--ink-soft); box-shadow: var(--shadow); }
.ans.next { background: var(--pencil); color: var(--pencil-ink); box-shadow: 0 4px 0 #C99A16; }
.ans.hear { background: var(--card); border: 2px solid var(--line); box-shadow: var(--shadow); font-size: 22px; }
.ans:active { transform: translateY(2px); box-shadow: none; }
.prompt { font-size: 20px; font-weight: 700; text-align: center; min-height: 1.5em; margin-bottom: 14px; }

.progress { display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: 16px; }
.progress .track { flex: 1; height: 10px; background: var(--tile-new); border-radius: 999px; overflow: hidden; }
.progress .fill { height: 100%; background: var(--pencil); border-radius: 999px; transition: width .3s; }

/* Home */
h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 4px; }
h2 { font-size: 22px; margin: 28px 0 8px; }
p { margin: 0 0 10px; }
.muted { color: var(--ink-soft); }
.lead { font-size: 20px; font-weight: 700; }
.tiles { display: grid; grid-template-columns: repeat(25, 1fr); gap: 3px; margin: 10px 0 6px; }
.tiles b { aspect-ratio: 1; border-radius: 3px; background: var(--tile-new); }
.tiles b.l { background: var(--tile-learn); }
.tiles b.k { background: var(--tile-known); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; color: var(--ink-soft); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.log { list-style: none; padding: 0; margin: 0; }
.log li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.log li span:last-child { color: var(--ink-soft); white-space: nowrap; }

/* Settings */
.setting { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting .label { flex: 1 1 180px; }
.setting .label small { display: block; color: var(--ink-soft); font-size: 14px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 42px; height: 42px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font-size: 22px; font-weight: 700; }
.stepper output { min-width: 2ch; text-align: center; font-weight: 700; font-size: 20px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  border: 2px solid transparent; background: var(--tile-new); border-radius: 10px;
  padding: 5px 10px; font-size: 17px; font-weight: 700; position: relative;
}
.chip.l { background: var(--tile-learn); color: #2A2100; }
.chip.k { background: var(--tile-known); color: #fff; }
.chip .x { margin-left: 6px; opacity: .6; font-weight: 400; }
.add { display: flex; gap: 8px; margin-top: 10px; }
.add input, .field { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); color: var(--ink); }
.field { display: block; width: 100%; margin: 4px 0 14px; }
label.f { display: block; font-weight: 700; }
.notice { background: var(--tile-new); border-radius: 12px; padding: 10px 14px; font-size: 15px; margin: 10px 0; }
.danger { color: var(--miss); border-color: var(--miss); }
.synccode { font-family: ui-monospace, Menlo, monospace; font-size: 20px; font-weight: 700; letter-spacing: .04em; margin: 8px 0 12px; -webkit-user-select: all; user-select: all; }
.dlg {
  border: 2px solid var(--line); border-radius: 20px; background: var(--card); color: var(--ink);
  padding: 20px; width: min(360px, calc(100vw - 36px)); box-shadow: var(--shadow);
}
.dlg::backdrop { background: rgba(18, 25, 38, .5); }
.dlg h2 { margin: 0 0 6px; font-size: 22px; }
.dlg .big { font-size: 22px; padding: 12px; }
.center { text-align: center; }
.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function () {
"use strict";

/* ---------- Word list from the teacher's sheet ---------- */
const TEACHER = ("the of and a to in is you that it he was for on are as with his they I at be this have from or one had by word " +
"but not what all were we when your can said there use an each which she do how their if will up other about out many then them " +
"these so some her would make like him into time has look two more write go see number no way could people my than first water " +
"been call who oil its now find long down day did get come made may part over new sound take only little work know place year live " +
"me back give most very after thing our just name good sentence man think say great where help through much before line right too " +
"mean old any same tell boy follow came want show also around form three small").split(" ");
const HIGHLIGHTED = ["the","of","and","a","to","on","I","we","up","go","see","no","my","me"];

/* ---------- Spaced repetition schedule (days until next review, by box) ---------- */
const INTERVAL = [0, 1, 2, 4, 8, 16, 32];
const MAX_BOX = 6, KNOWN_BOX = 4;
/* Times one word can come up in a round: the first time, then twice more after misses */
const ASKS_MAX = 3;
/* Where a missed word comes back: this many cards on */
const REASK_GAP = 4;
/* How long "Yes!" stays up before the next word */
const RIGHT_PAUSE = 900;

function today() { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 86400000); }
function status(w) { if (!w || !w.b) return "n"; return w.b >= KNOWN_BOX ? "k" : "l"; }
const ALNUM = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
function newId() { return Array.from(crypto.getRandomValues(new Uint8Array(16)), x => ALNUM[x % 62]).join(""); }
function int(x, d) { return Number.isInteger(x) ? x : d; }

/* ---------- What the grown-ups share ----------
   Everything one child's grown-ups share lives on the server under a random 20-character code, in two parts:
   - The record (`doc`): the child's name, the word list, homework words, settings, and `base`, the
     progress the answers build on (from before the answer log, or from a restore or a reset). It syncs
     whole, and when two phones change it at once the first one saved wins.
   - The answer log: one entry per tap (right, wrong, an undo, or a word's status set by hand). Entries are
     only ever added, so a phone that quizzed offline sends its answers later and none are lost.
   Every phone works out the child's progress by replaying the answers on top of `base` in the order
   they were given, so phones with the same answers show the same progress. */
function blankWord() { return { b: 0, d: 0, r: 0, w: 0 }; }
function freshWords() {
  const t = today(), words = {};
  TEACHER.forEach(w => { words[w] = blankWord(); });
  HIGHLIGHTED.forEach(w => { words[w].b = 1; words[w].d = t; });
  return words;
}
function freshStats() { return { stars: 0, streak: 0, lastDay: null, newDay: null, newCount: 0 }; }
function freshDoc(name) {
  return { v: 2, name, order: TEACHER.slice(), custom: [], settings: { newPerDay: 3, sessionSize: 12 },
    base: { words: freshWords(), stats: freshStats(), after: 0 } };
}
function isObj(x) { return !!x && typeof x === "object" && !Array.isArray(x); }
function validDoc(d) {
  return isObj(d) && d.v === 2 && Array.isArray(d.order) && Array.isArray(d.custom) && isObj(d.settings) &&
    isObj(d.base) && isObj(d.base.words) && isObj(d.base.stats);
}
/* The app before the answer log kept one progress object (v1): it becomes the base */
function validV1(s) { return isObj(s) && s.v === 1 && Array.isArray(s.order) && isObj(s.words) && isObj(s.settings) && isObj(s.stats); }
function fromV1(s, name) {
  const st = s.stats;
  return {
    v: 2, name: name || "", order: s.order.slice(), custom: Array.isArray(s.custom) ? s.custom.slice() : [],
    settings: { newPerDay: int(s.settings.newPerDay, 3), sessionSize: int(s.settings.sessionSize, 12) },
    base: { words: s.words, after: 0, stats: { stars: int(st.stars, 0), streak: int(st.streak, 0),
      lastDay: int(st.lastDay, null), newDay: int(st.newDay, null), newCount: int(st.newCount, 0) } }
  };
}

/* Progress from the record and the answers: { words, stats, list } where `list` is the answers that
   count, oldest first. Answers the server numbered at or before `base.after` came before a reset or
   restore and don't count; an undone answer doesn't either. */
function derive(doc, answers) {
  const words = JSON.parse(JSON.stringify(doc.base.words));
  const stats = Object.assign(freshStats(), doc.base.stats);
  const after = doc.base.after || 0;
  const live = answers.filter(a => !a.n || a.n > after);
  const undone = new Set(live.filter(a => a.undo).map(a => a.undo));
  const list = live.filter(a => !a.undo && !undone.has(a.id))
    .sort((x, y) => (x.at - y.at) || (x.id < y.id ? -1 : x.id > y.id ? 1 : 0));
  list.forEach(a => apply(words, stats, a));
  doc.order.forEach(w => { if (!words[w]) words[w] = blankWord(); });
  return { words, stats, list };
}
function apply(words, st, a) {
  const day = a.day;
  const w = words[a.w] || (words[a.w] = blankWord());
  if (a.set) { // set by hand in Settings
    if (a.set === "n") { w.b = 0; w.d = 0; }
    else if (a.set === "l") { w.b = 1; w.d = day; }
    else { w.b = KNOWN_BOX; w.d = day + INTERVAL[KNOWN_BOX]; }
    delete w.wd;
    return;
  }
  // daily streak, and how many new words were started today
  if (st.lastDay === null || day > st.lastDay) {
    st.streak = st.lastDay === day - 1 ? st.streak + 1 : 1;
    st.lastDay = day;
  }
  if (w.b === 0) {
    if (st.newDay !== day) { st.newDay = day; st.newCount = 0; }
    st.newCount++;
  }
  if (a.r === "right") {
    w.r++;
    if (w.b === 0) { w.b = 1; w.d = day + 1; st.stars++; }
    else if (w.wd === day) { w.b = Math.max(w.b, 1); w.d = day + 1; } // right after a miss today: tomorrow, no star
    else if (w.d <= day) { w.b = Math.min(MAX_BOX, w.b + 1); w.d = day + INTERVAL[w.b]; st.stars++; }
    else st.stars++; // extra practice: a star, but no schedule change
  } else {
    w.w++; w.b = 1; w.d = day; w.wd = day; // a miss: back to box 1, due again today
  }
}

/* ---------- This phone's copy ----------
   { code, version, dirty, doc, answers, seen, me }: `version` is the server's version of the record that
   `doc` is based on, `dirty` means `doc` has changes to send, `seen` is the highest answer number fetched,
   and `me` is this grown-up's name. Answers without a number `n` haven't reached the server yet. */
const LS_KEY = "sightwords.v2";
const CODE_RE = /^[0-9A-HJKMNP-TV-Z]{20}$/;
let local = loadLocal();
let cur = null; // derive() of local
if (local) refresh();

function loadLocal() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && CODE_RE.test(s.code) && validDoc(s.doc) && Array.isArray(s.answers)) return s;
  } catch (e) {}
  // progress from the app before the answer log, and its sync code if it had one
  try {
    const old = JSON.parse(localStorage.getItem("sightwords.v1"));
    if (validV1(old)) {
      let sync = null;
      try { sync = JSON.parse(localStorage.getItem("sightwords.sync")); } catch (e) {}
      const synced = !!sync && CODE_RE.test(sync.code) && Number.isInteger(sync.version);
      return { code: synced ? sync.code : newCode(), version: synced ? sync.version : 0, dirty: true,
        doc: fromV1(old), answers: [], seen: 0, me: "" };
    }
  } catch (e) {}
  return null;
}
function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(local)); } catch (e) {} }
function refresh() {
  const after = local.doc.base.after || 0;
  local.answers = local.answers.filter(a => !a.n || a.n > after);
  cur = derive(local.doc, local.answers);
}
function kid() { return local.doc.name || "your reader"; }

/* Add an answer to the log */
function record(fields) {
  const a = Object.assign({ id: newId(), at: Date.now(), day: today(), by: local.me || "" }, fields);
  local.answers.push(a);
  persist(); scheduleSync();
  return a;
}
/* Change the record. `fn` changes the doc it's given, or returns one to use instead. */
function editDoc(fn) {
  const d = fn(local.doc);
  if (d) local.doc = d;
  local.dirty = true; docEdits++;
  persist(); refresh(); scheduleSync();
}

/* ---------- Sync ---------- */
const SYNC_DELAY = 2000;          // after the last change
const SYNC_RETRY = 60000;         // after a failed attempt with changes still to send
const PUSH_MAX = 100;             // answers per request
const JSON_HEADERS = { "Content-Type": "application/json" };
let syncBusy = false, syncAgain = false, syncTimer = null, syncedAt = null, syncError = "", docEdits = 0;

function newCode() {
  const A = "0123456789ABCDEFGHJKMNPQRSTVWXYZ"; // Crockford base32: no I, L, O or U
  return Array.from(crypto.getRandomValues(new Uint8Array(20)), x => A[x & 31]).join("");
}
function showCode(c) { return c.match(/.{4}/g).join("-"); }
/* A code typed in, or pasted with the rest of a share link */
function readCode(s) {
  s = String(s);
  const m = s.match(/join=([0-9A-Za-z-]+)/);
  if (m) s = m[1];
  s = s.toUpperCase().replace(/[^0-9A-Z]/g, "").replace(/O/g, "0").replace(/[IL]/g, "1");
  return CODE_RE.test(s) ? s : null;
}
function shareLink() { return location.origin + location.pathname.replace(/index\.html$/, "") + "#join=" + local.code; }
function unsent() { return local.answers.filter(a => !a.n); }
function scheduleSync() { clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, SYNC_DELAY); }
function syncLine() {
  if (!local) return "";
  if (syncError) return syncError;
  if (local.dirty || unsent().length) return "Waiting to sync…";
  return syncedAt ? "Synced at " + new Date(syncedAt).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + "." : "Syncing…";
}
function showSyncLine() { const el = document.getElementById("syncmsg"); if (el) el.textContent = syncLine(); }

/* This phone switched to another child's code while a request was out */
class Stale extends Error {}
function serverError(status) { return new Error("Sync isn’t working right now (the server said " + status + "). Answers are still saved on this phone."); }
async function call(code, path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => null);
  if (!local || local.code !== code) throw new Stale();
  return { res, body };
}

/* Send this phone's changes and fetch everyone else's. `leaving`: the app is going to the background. */
async function syncNow(leaving) {
  if (!local) return;
  if (syncBusy) { syncAgain = true; return; }
  syncBusy = true; clearTimeout(syncTimer);
  const code = local.code;
  let failed = false, changed = false;
  try {
    changed = await syncDoc(code, !!leaving);
    if (await sendAnswers(code, !!leaving)) syncAgain = true;
    else if (!leaving && await fetchAnswers(code)) changed = true;
    syncError = ""; syncedAt = Date.now();
  } catch (e) {
    if (!(e instanceof Stale)) {
      failed = true;
      syncError = e instanceof TypeError ? "Offline. Answers are saved on this phone and will sync when it’s back online." : e.message;
    }
  } finally {
    syncBusy = false;
    if (local) {
      persist();
      if (changed) { refresh(); redraw(); } else showSyncLine();
    }
    if (syncAgain) { syncAgain = false; syncNow(); }
    else if (failed && local && (local.dirty || unsent().length)) syncTimer = setTimeout(syncNow, SYNC_RETRY);
  }
}
/* The record: send ours if it changed, otherwise take the server's if it's newer. True if ours was replaced. */
async function syncDoc(code, leaving) {
  let changed = false;
  for (let tries = 0; tries < 3; tries++) {
    const pushing = local.dirty, sent = docEdits;
    const { res, body } = await call(code, "/api/sync/" + code, pushing
      ? { method: "PUT", headers: JSON_HEADERS, body: JSON.stringify({ version: local.version, data: local.doc }), keepalive: leaving }
      : { cache: "no-store" });
    if (res.ok && pushing) { local.version = body.version; if (docEdits === sent) local.dirty = false; return changed; }
    if ((res.ok || res.status === 409) && body) {
      if (!pushing && body.version === local.version) return changed;
      takeDoc(body); changed = true;
      if (!local.dirty) return changed;
    } else if (res.status === 404) { local.version = 0; local.dirty = true; } // nothing there: put ours there
    else throw serverError(res.status);
  }
  return changed;
}
function takeDoc(body) {
  local.version = body.version;
  const d = body.data;
  if (validDoc(d)) { local.doc = d; local.dirty = false; }
  else if (validV1(d)) { local.doc = fromV1(d, local.doc.name); local.dirty = true; } // stored by the app before the answer log
  else local.dirty = true; // nothing usable there: write ours over it
}
/* Answers not on the server yet. Sending one twice is harmless. True if the server has no record for this code. */
async function sendAnswers(code, leaving) {
  const todo = unsent();
  for (let i = 0; i < todo.length; i += PUSH_MAX) {
    const { res } = await call(code, "/api/answers/" + code, { method: "POST", headers: JSON_HEADERS,
      body: JSON.stringify({ answers: todo.slice(i, i + PUSH_MAX) }), keepalive: leaving });
    if (res.status === 404) { local.version = 0; local.dirty = true; return true; }
    if (!res.ok) throw serverError(res.status);
  }
  return false;
}
/* Answers numbered after the last one seen, ours included (they get their number). True if any were new here. */
async function fetchAnswers(code) {
  let changed = false;
  for (;;) {
    const { res, body } = await call(code, "/api/answers/" + code + "?after=" + local.seen, { cache: "no-store" });
    if (!res.ok || !body || !Array.isArray(body.answers)) throw serverError(res.status);
    const byId = new Map(local.answers.map(a => [a.id, a]));
    body.answers.forEach(a => {
      const mine = byId.get(a.id);
      if (mine) mine.n = a.n;
      else { local.answers.push(a); byId.set(a.id, a); changed = true; }
      local.seen = Math.max(local.seen, a.n);
    });
    if (!body.more) return changed;
  }
}

/* Switch this phone to the child under `code`, from a share link or a code typed in */
async function join(code) {
  if (!code) { note = "That isn’t a share link or code. A code has 20 letters and numbers, like ABCD-EFGH-JKMN-PQRS-TV12."; render(); return; }
  if (local && local.code === code) { note = "This phone already uses that link."; screen = "home"; render(); return; }
  note = "Looking it up…"; render();
  let res = null, body = null;
  try { res = await fetch("/api/sync/" + code, { cache: "no-store" }); body = await res.json(); } catch (e) {}
  const doc = body && (validDoc(body.data) ? body.data : validV1(body.data) ? fromV1(body.data) : null);
  if (!res) note = "Couldn’t reach the server. Check the internet connection and try again.";
  else if (res.status === 404) note = "Nothing is saved under that link. Ask for it again, or check the code against the other phone.";
  else if (!res.ok || !doc) note = "Joining didn’t work (the server said " + res.status + "). Try again.";
  if (!doc) { render(); return; }
  if (local && !confirm("Switch this phone to " + (doc.name ? doc.name + "’s" : "the") + " progress from the link? " +
      "What’s on this phone now stays saved for anyone who has its own link.")) { note = ""; render(); return; }
  const me = local ? local.me : "";
  local = { code, version: body.version, dirty: body.data.v !== 2, doc, answers: [], seen: 0, me };
  syncError = ""; syncedAt = null;
  persist(); refresh();
  note = "You’re in. Everyone with this link sees the same progress.";
  session = null; screen = "home"; render();
  syncNow();
  if (!me) askName(render);
}

/* ---------- Speech ---------- */
function say(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.82;
    speechSynthesis.speak(u);
  } catch (e) {}
}

/* ---------- Quiz ---------- */
let screen = "home";
let note = "";      // a message shown once at the top of the next screen
let session = null; // { cards, i, earned, moved, extra, showing, gain, timer, undo }

function newWordsLeftToday() {
  const t = today(), st = cur.stats;
  const used = st.newDay === t ? st.newCount : 0;
  return Math.max(0, local.doc.settings.newPerDay - used);
}
function dueWords() {
  const t = today(), W = cur.words;
  return local.doc.order.filter(w => W[w].b > 0 && W[w].d <= t)
    .sort((a, b) => (W[a].d - W[b].d) || (W[a].b - W[b].b));
}
function unstarted() { return local.doc.order.filter(w => cur.words[w].b === 0); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function plan() {
  const size = local.doc.settings.sessionSize;
  const nNew = Math.min(newWordsLeftToday(), unstarted().length, size);
  const reviews = dueWords().slice(0, size - nNew);
  return { reviews, fresh: unstarted().slice(0, nNew) };
}
function buildSession(extra) {
  let cards;
  if (!extra) {
    const p = plan();
    cards = shuffle(p.reviews.map(w => ({ word: w, isNew: false, again: false })));
    // spread new words through the round instead of bunching them
    p.fresh.forEach((w, k) => {
      const pos = Math.min(cards.length, Math.round((k + 1) * cards.length / (p.fresh.length + 1)) + k);
      cards.splice(pos, 0, { word: w, isNew: true, again: false });
    });
  } else {
    // extra practice: the shakiest words already started
    const W = cur.words;
    const started = local.doc.order.filter(w => W[w].b > 0).sort((a, b) => (W[a].b - W[b].b) || (W[a].d - W[b].d));
    cards = shuffle(started.slice(0, local.doc.settings.sessionSize).map(w => ({ word: w, isNew: false, again: false })));
  }
  return { cards, i: 0, earned: 0, moved: 0, extra: !!extra, showing: null, gain: 0, timer: null, undo: [] };
}
function startSession(extra) {
  if (!local.me) { askName(() => startSession(extra)); return; }
  session = buildSession(extra);
  if (!session.cards.length) { session = null; screen = "home"; render(); return; }
  screen = "quiz";
  render();
}
function card() { return session.cards[session.i]; }

/* Right or wrong: logged now (Undo takes it back) */
function answer(r) {
  const s = session, c = card();
  clearTimeout(s.timer);
  const before = status(cur.words[c.word]), stars = cur.stats.stars;
  const a = record({ w: c.word, r });
  refresh();
  const step = { id: a.id, i: s.i, cards: s.cards.slice(), earned: cur.stats.stars - stars,
    moved: before !== "k" && status(cur.words[c.word]) === "k" ? 1 : 0 };
  s.undo.push(step);
  s.earned += step.earned; s.moved += step.moved; s.gain = step.earned;
  s.showing = r;
  if (r === "wrong") {
    // it comes back a few cards later, up to ASKS_MAX times in the round
    if (s.cards.filter(x => x.word === c.word).length < ASKS_MAX)
      s.cards.splice(Math.min(s.cards.length, s.i + REASK_GAP), 0, { word: c.word, isNew: false, again: true });
  } else {
    s.timer = setTimeout(next, RIGHT_PAUSE);
  }
  renderQuiz();
}
/* Skip: nothing is logged and the word stays due */
function skip() {
  session.undo.push({ id: null, i: session.i, cards: session.cards.slice(), earned: 0, moved: 0 });
  next();
}
function next() {
  const s = session;
  clearTimeout(s.timer);
  s.showing = null;
  s.i++;
  if (s.i >= s.cards.length) { screen = "done"; render(); return; }
  renderQuiz();
}
/* Back to the card before the last tap, taking its answer back */
function undo() {
  const s = session, step = s.undo.pop();
  if (!step) return;
  clearTimeout(s.timer);
  if (step.id) { record({ undo: step.id }); refresh(); }
  s.earned -= step.earned; s.moved -= step.moved;
  s.cards = step.cards; s.i = step.i; s.showing = null;
  renderQuiz();
}

const STAR = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#F2BE2E" stroke="#C99A16" stroke-width="1.2" d="M12 2.6l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.9 6.2 20.1l1.4-6.4L2.7 9.3l6.5-.7z"/></svg>';
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch])); }
function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
function noteHtml() { const n = note; note = ""; return n ? '<div class="notice" role="status">' + esc(n) + '</div>' : ""; }

function topBar(right) {
  const st = cur.stats;
  const streak = st.streak > 1 && (st.lastDay === today() || st.lastDay === today() - 1) ? '<span class="streak">' + st.streak + ' days in a row</span>' : "";
  return '<div class="bar"><span class="stars" aria-label="' + st.stars + ' stars">' + STAR + st.stars + streak + '</span><span class="bar-right">' + right + '</span></div>';
}
function wordSheet(word, opts) {
  opts = opts || {};
  const len = word.length;
  const cls = len >= 8 ? "word small" : len >= 6 ? "word long" : "word";
  return '<div class="sheet ' + (opts.cls || "") + " " + (opts.state || "") + '">' +
    (opts.tag ? '<span class="tag">' + opts.tag + '</span>' : "") +
    (opts.verdict ? '<span class="verdict ' + opts.state + '">' + opts.verdict + '</span>' : "") +
    '<span class="' + cls + '"><span class="ruler" aria-hidden="true"><i class="top"></i><i class="mid"></i><i class="base"></i></span><span class="word-text">' + esc(word) + '</span></span></div>';
}
function counts() {
  let n = 0, l = 0, k = 0;
  local.doc.order.forEach(w => { const s = status(cur.words[w]); if (s === "k") k++; else if (s === "l") l++; else n++; });
  return { n, l, k, total: local.doc.order.length };
}
/* Quizzes so far, newest first: one line per grown-up per day */
function quizLog() {
  const groups = new Map();
  cur.list.forEach(a => {
    if (!a.r) return;
    const key = a.day + "\n" + a.by;
    let g = groups.get(key);
    if (!g) groups.set(key, g = { day: a.day, by: a.by, right: 0, wrong: 0, at: 0 });
    g[a.r]++; g.at = Math.max(g.at, a.at);
  });
  return Array.from(groups.values()).sort((x, y) => y.at - x.at);
}
function grownUps() {
  const names = new Set(local.answers.map(a => a.by).filter(Boolean));
  if (local.me) names.add(local.me);
  return Array.from(names);
}

      const w = rm.getAttribute("data-rm");
      if (confirm("Remove “" + w + "”?")) {
        editDoc(d => { d.order = d.order.filter(x => x !== w); d.custom = d.custom.filter(x => x !== w); delete d.base.words[w]; });
        renderSettings();
      }
      return;
    }
    const chip = e.target.closest("[data-w]");
    if (!chip) return;
    const w = chip.getAttribute("data-w"), s = status(cur.words[w]);
    record({ w, set: s === "n" ? "l" : s === "l" ? "k" : "n" });
    refresh(); renderSettings();
  });
  on("reset", () => {
    if (!confirm("Reset all of " + kid() + "’s progress and stars, for every grown-up? This can’t be undone.")) return;
    local.answers = local.answers.filter(a => a.n); // not sent yet: from before the reset
    editDoc(d => { d.base = { words: freshWords(), stats: freshStats(), after: local.seen }; });
    renderSettings();
  });
}
async function invite() {
  const url = shareLink();
  const text = "Help quiz " + kid() + " on sight words. Open this link on your phone:";
  if (navigator.share) {
    try { await navigator.share({ title: "Sight Words", text, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  let copied = false;
  try { await navigator.clipboard.writeText(url); copied = true; } catch (e) {}
  alert(copied ? "Link copied. Send it to the other grown-up." : "Send this link to the other grown-up:\n" + url);
}
function backupProgress() {
  // the record with the progress so far as its base: restoring it needs no answers
  const json = JSON.stringify(Object.assign({}, local.doc, { base: { words: cur.words, stats: cur.stats, after: 0 } }));
  const name = "sight-words-backup-" + new Date(today() * 86400000).toISOString().slice(0, 10) + ".json";
  const blob = new Blob([json], { type: "application/json" });
  // A Home Screen app can't reliably download a file, so offer the share sheet (Save to Files) where there is one
  if (typeof File === "function" && navigator.canShare) {
    const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare({ files: [file] })) { navigator.share({ files: [file] }).catch(() => {}); return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
async function restoreProgress(file) {
  const msg = document.getElementById("bkmsg");
  let s = null;
  try { s = JSON.parse(await file.text()); } catch (e) {}
  const d = validDoc(s) ? s : validV1(s) ? fromV1(s) : null; // v1: a backup from before the answer log
  if (!d) { msg.textContent = "That file isn’t a Sight Words backup, so nothing was changed."; return; }
  if (!confirm("Replace " + kid() + "’s progress with the backup, for every grown-up? This can’t be undone.")) return;
  local.answers = local.answers.filter(a => a.n); // not sent yet: from before the restore
  editDoc(doc => Object.assign({}, d, { name: d.name || doc.name, base: Object.assign({}, d.base, { after: local.seen }) }));
  renderSettings();
  document.getElementById("bkmsg").textContent = "Progress restored.";
}
function addWords() {
  const input = document.getElementById("addin");
  const parts = input.value.split(/[,\s]+/).map(x => x.trim()).filter(Boolean);
  const existing = new Set(local.doc.order.map(w => w.toLowerCase()));
  const added = [];
  parts.forEach(p => {
    const w = p.replace(/[^A-Za-z'\-]/g, "");
    if (!w || existing.has(w.toLowerCase())) return;
    existing.add(w.toLowerCase()); added.push(w);
  });
  if (!added.length) { input.value = ""; return; }
  editDoc(d => {
    added.forEach(w => { d.base.words[w] = blankWord(); d.custom.push(w); });
    // homework words go first in the not-started line
    const firstNew = d.order.findIndex(w => cur.words[w].b === 0);
    d.order.splice(firstNew < 0 ? d.order.length : firstNew, 0, ...added);
  });
  renderSettings();
}

function dayLabel(d) {
  const t = today();
  if (d === t) return "Today";
  if (d === t - 1) return "Yesterday";
  return new Date(d * 86400000).toLocaleDateString(undefined, { timeZone: "UTC", weekday: "short", month: "short", day: "numeric" });
}
/* Ask this grown-up's name once, for the quiz log. `then` runs once there is one. */
function askName(then) {
  const dlg = document.createElement("dialog");
  dlg.className = "dlg";
  dlg.innerHTML = '<form method="dialog"><h2>Who’s quizzing?</h2>' +
    '<p class="muted">Your name shows next to your quizzes, so the other grown-ups can see who practised.</p>' +
    '<input class="field" id="namein" maxlength="30" autocomplete="off" enterkeyhint="done" placeholder="Like Mom or Grandpa Joe" aria-label="Your name" autofocus>' +
    '<div class="row"><button type="button" class="plain" id="nameno">Cancel</button><button class="big" value="ok">OK</button></div></form>';
  document.body.appendChild(dlg);
  dlg.querySelector("#nameno").addEventListener("click", () => dlg.close());
  dlg.addEventListener("close", () => {
    const name = dlg.querySelector("input").value.trim();
    dlg.remove();
    if (dlg.returnValue === "ok" && name && local) { local.me = name; persist(); then(); }
  });
  dlg.showModal();
}
function on(id, fn) { const el = document.getElementById(id); if (el) el.addEventListener("click", fn); }
function render() {
  if (!local) renderWelcome();
  else if (screen === "quiz" && session) renderQuiz();
  else if (screen === "done" && session) renderDone();
  else if (screen === "settings") renderSettings();
  else { screen = "home"; renderHome(); }
  window.scrollTo(0, 0);
}
/* After a sync brought something new. Settings isn't redrawn while someone is typing in it. */
function redraw() {
  const typing = document.activeElement && document.activeElement.tagName === "INPUT";
  if (screen === "home") renderHome();
  else if (screen === "settings" && !typing) renderSettings();
  else showSyncLine();
}

const joinHash = location.hash.match(/join=([0-9A-Za-z-]+)/);
if (joinHash) history.replaceState(null, "", location.pathname + location.search);
if (local) persist(); // keeps what loadLocal() brought over from the app before the answer log
render();
if ("serviceWorker" in navigator && window.isSecureContext) navigator.serviceWorker.register("sw.js").catch(() => {});
if (joinHash) join(readCode(joinHash[1])).finally(() => syncNow());
else syncNow();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") syncNow();
  else if (local && (local.dirty || unsent().length)) syncNow(true);
});
window.addEventListener("online", () => syncNow());
})();
</script>
